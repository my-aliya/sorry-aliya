<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliya... 🥺💗</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Pacifico&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <script type="text/javascript">
        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
            t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "yofvxtaabm");
    </script>
</head>

<body>

    <div id="stars"></div>
    <div id="hearts"></div>
    <div id="petals"></div>

    <div class="moon"></div>
    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>

    <button class="music-btn" id="musicBtn">♫</button>

    <audio id="song" loop>
        <source src="assets/music/sorry-song.mp3" type="audio/mpeg">
    </audio>

    <main class="scene">

        <section class="card">

            <div class="sparkle">✨</div>

            <div class="character">🥺</div>

            <p class="little-text">
                Aliya... ek minute na 👉👈
            </p>

            <h1>I'm Sorry, Aliya 💗</h1>

            <div class="message">
                <span id="typing"></span>
                <span class="cursor"></span>
            </div>

            <div class="buttons">

                <button class="forgive-btn" id="forgiveBtn">
                    Theek hai, maaf kiya 🥹💗
                </button>

                <button class="wait-btn" id="waitBtn">
                    Hmmm... 😤
                </button>

            </div>

            <p class="bottom-note">
                P.S. — Aliya ko manana thoda mushkil hai...
                par impossible nahi. 🥺🌸
            </p>

        </section>

    </main>

    <div class="final-screen" id="finalScreen">

        <div class="final-box">

            <div class="final-emoji">
                🥹💗🌸
            </div>

            <p class="tiny-title">
                Aliya ne maaf kar diya...
            </p>

            <h2>YAYYYY! 🥳</h2>

            <p>
                Thank you, Aliya. 💗<br><br>

                Ab promise...
                itni cute si Aliya ko
                dobara sad nahi karna. 🥺
                <br><br>

                Ek smile please? 🌸
            </p>

            <button class="close-btn" id="closeBtn">
                😊 *smiles*
            </button>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
